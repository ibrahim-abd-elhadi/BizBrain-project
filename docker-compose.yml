# BizBrain: one machine, five services (README Section 1).
# brain-worker runs the Brain's Cairo-time jobs; brain-api serves the Brain screens (feature 003).

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      # Bootstrap superuser: used only by the init script and manual administration.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # One login per database; the init script creates them (research R-09).
      ERP_DB_USER: ${ERP_DB_USER}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
      BRAIN_DB_USER: ${BRAIN_DB_USER}
      BRAIN_DB_PASSWORD: ${BRAIN_DB_PASSWORD}
      # brain-api's read-only login inside brain_db (02-brain-api-role.sh, feature 003 R-16).
      BRAIN_API_DB_USER: ${BRAIN_API_DB_USER}
      BRAIN_API_DB_PASSWORD: ${BRAIN_API_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  erp-backend:
    build: ./erp-backend
    environment:
      # erp-backend connects as the ERP login, which can reach only erp_db.
      ERP_DATABASE_URL: postgresql+psycopg://${ERP_DB_USER}:${ERP_DB_PASSWORD}@postgres:5432/erp_db
      ERP_JWT_PRIVATE_KEY_FILE: /run/erp-keys/erp_jwt_ed25519.pem
      ERP_JWT_TTL_MINUTES: ${ERP_JWT_TTL_MINUTES:-480}
      ERP_MANAGER_USERNAME: ${ERP_MANAGER_USERNAME:-}
      ERP_MANAGER_PASSWORD: ${ERP_MANAGER_PASSWORD:-}
      ERP_SPIKE_Z: ${ERP_SPIKE_Z:-4}
      ERP_SIMULATE_BATCH_FRACTION: ${ERP_SIMULATE_BATCH_FRACTION:-0.25}
      ERP_SIMULATE_RETURN_RATE: ${ERP_SIMULATE_RETURN_RATE:-0.02}
      ERP_RANDOM_SEED: ${ERP_RANDOM_SEED:-}
      ERP_SEED_RANDOM_SEED: ${ERP_SEED_RANDOM_SEED:-20261202}
      ERP_SERVICE_TOKEN_TTL_DAYS: ${ERP_SERVICE_TOKEN_TTL_DAYS:-90}
      ERP_DB_TRANSACTION_TIMEOUT_SECONDS: ${ERP_DB_TRANSACTION_TIMEOUT_SECONDS:-60}
    volumes:
      - ./secrets/erp_jwt_ed25519.pem:/run/erp-keys/erp_jwt_ed25519.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ERP_BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - erp-backend
      - brain-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # The Brain: one image, two commands (README Section 1). It reaches the ERP only through the
  # Canonical API with its service token, and connects only to brain_db (constitution II).
  brain-worker:
    build: ./brain
    command: ["serve"]
    environment:
      BRAIN_DATABASE_URL: postgresql+psycopg://${BRAIN_DB_USER}:${BRAIN_DB_PASSWORD}@postgres:5432/brain_db
      BRAIN_API_DB_USER: ${BRAIN_API_DB_USER}
      BRAIN_ERP_BASE_URL: http://erp-backend:8000
      BRAIN_ERP_SERVICE_TOKEN_FILE: /run/secrets/brain_service_token
    volumes:
      - ./secrets/brain_service_token:/run/secrets/brain_service_token:ro
    depends_on:
      postgres:
        condition: service_healthy
      erp-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "brain-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  brain-api:
    build: ./brain
    command: ["api"]
    environment:
      BRAIN_API_DATABASE_URL: postgresql+psycopg://${BRAIN_API_DB_USER}:${BRAIN_API_DB_PASSWORD}@postgres:5432/brain_db
      BRAIN_ERP_JWT_PUBLIC_KEY_FILE: /run/erp-keys/erp_jwt_ed25519.pub.pem
      # Approvals send the draft PO with the Brain's service token (feature 004, research R-10).
      BRAIN_ERP_BASE_URL: http://erp-backend:8000
      BRAIN_ERP_SERVICE_TOKEN_FILE: /run/secrets/brain_service_token
    volumes:
      - ./secrets/erp_jwt_ed25519.pub.pem:/run/erp-keys/erp_jwt_ed25519.pub.pem:ro
      - ./secrets/brain_service_token:/run/secrets/brain_service_token:ro
    depends_on:
      brain-worker:
        condition: service_healthy
      erp-backend:
        condition: service_started

volumes:
  pgdata:
