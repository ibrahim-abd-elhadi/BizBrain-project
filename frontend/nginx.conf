server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The 1 MiB CSV limit is enforced by the backend, so nginx must let a bit more through.
    client_max_body_size 2m;

    # Same origin for the browser: no CORS. The ERP and the Brain each have their own API.
    location /api/v1/erp/ {
        proxy_pass http://erp-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/brain/ {
        proxy_pass http://brain-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
